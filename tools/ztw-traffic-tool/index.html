<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>交通录像标记小工具</title>
<style>
  /* ==========================================================
     主题变量
     ========================================================== */
  :root{
    --bg:#0d1015;
    --panel:#151a21;
    --panel-soft:#1b212a;
    --line:#252c37;
    --text:#e8ebf0;
    --muted:#8b94a4;
    --accent:#00aeec;
    --accent-soft:rgba(0,174,236,.13);
    --green:#3ddc97;
    --danger:#ff6b6b;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    margin:0;
    height:100%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    color:var(--text);
    font:14px/1.5 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(900px 480px at 10% -18%, rgba(0,174,236,.14), transparent 62%),
      radial-gradient(760px 420px at 96% -6%, rgba(61,220,151,.08), transparent 58%),
      var(--bg);
  }

  button{ font:inherit; }

  /* ==========================================================
     顶部栏
     ========================================================== */
  .topbar{
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 22px;
    border-bottom:1px solid var(--line);
    background:rgba(13,16,21,.72);
    backdrop-filter:blur(10px);
  }
  .brand{ display:flex; align-items:center; gap:11px; min-width:0; }
  .logo{
    width:34px; height:34px; flex:none;
    border-radius:10px;
    display:grid; place-items:center;
    font-weight:800; font-size:15px; color:#04212c;
    background:linear-gradient(135deg, var(--accent), var(--green));
    box-shadow:0 8px 20px -10px rgba(0,174,236,.9);
  }
  .brand h1{ margin:0; font-size:15px; font-weight:600; letter-spacing:.2px; }
  .brand p{ margin:2px 0 0; font-size:11.5px; color:var(--muted); }

  .top-actions{ display:flex; align-items:center; gap:12px; flex:none; }
  .hint{ font-size:12px; color:var(--muted); }

  .file-btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:9px 16px;
    border-radius:10px;
    border:none; cursor:pointer;
    font-size:13px; font-weight:600; color:#02202b;
    background:linear-gradient(180deg,#00b6f5,#0098d4);
    box-shadow:0 10px 24px -14px rgba(0,174,236,1);
    transition:transform .15s ease, filter .15s ease;
    white-space:nowrap;
  }
  .file-btn:hover{ transform:translateY(-1px); filter:brightness(1.06); }
  .file-btn:active{ transform:translateY(0); }
  .file-btn svg{ width:16px; height:16px; fill:currentColor; }
  .file-btn input{ display:none; }

  /* ==========================================================
     主体：左右分栏
     ========================================================== */
  .layout{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:minmax(0,1fr) 392px;
    gap:16px;
    padding:16px 22px 20px;
  }
  .panel{
    min-height:0;
    background:linear-gradient(180deg, rgba(24,29,37,.96), rgba(18,22,29,.96));
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 28px 60px -40px rgba(0,0,0,1);
  }

  /* ---------- 左侧：播放器 ---------- */
  .player{ display:flex; flex-direction:column; overflow:hidden; }

  .player-head{
    flex:none;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:11px 16px;
    border-bottom:1px solid var(--line);
    background:rgba(17,21,28,.7);
  }
  .file-name{
    font-size:12.5px; color:#cfd6e0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .file-meta{ flex:none; font-size:11.5px; color:var(--muted); font-family:ui-monospace,Consolas,"Courier New",monospace; }

  .video-shell{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    background:#000;
  }
  .video-shell video{
    display:block;
    width:100%;
    flex:1;
    min-height:0;
    object-fit:contain;
    background:#000;
    cursor:pointer;
  }

  /* 未加载录像时的空状态遮罩 */
  .empty{
    position:absolute; inset:0;
    display:grid; place-items:center;
    padding:24px; text-align:center;
    background:
      radial-gradient(620px 300px at 50% 38%, rgba(0,174,236,.12), transparent 70%),
      #090c11;
    transition:opacity .25s ease;
  }
  .empty.hidden{ display:none; }
  .empty-inner{ max-width:400px; }
  .empty-icon{
    width:58px; height:58px; margin:0 auto 14px;
    border-radius:50%;
    display:grid; place-items:center;
    background:rgba(0,174,236,.10);
    border:1px solid rgba(0,174,236,.35);
    color:var(--accent);
  }
  .empty-icon svg{ width:24px; height:24px; fill:currentColor; margin-left:3px; }
  .empty h3{ margin:0 0 6px; font-size:15px; font-weight:600; }
  .empty p{ margin:0 0 16px; font-size:12.5px; line-height:1.75; color:var(--muted); }
  .ghost-btn{
    padding:8px 18px; border-radius:9px;
    border:1px solid rgba(0,174,236,.45);
    background:rgba(0,174,236,.10);
    color:#7fd8f7; font-size:12.5px; cursor:pointer;
    transition:.15s ease;
  }
  .ghost-btn:hover{ background:rgba(0,174,236,.18); border-color:var(--accent); }

  /* 自定义控制条 */
  .controls{
    flex:none;
    display:flex; align-items:center; gap:12px;
    padding:9px 14px;
    border-top:1px solid var(--line);
    background:#11151c;
  }
  .ctrl-btn{
    flex:none;
    width:34px; height:34px;
    display:grid; place-items:center;
    border:1px solid transparent;
    border-radius:9px;
    background:transparent;
    color:var(--text);
    cursor:pointer;
    transition:.15s ease;
  }
  .ctrl-btn:hover{ background:#1c222c; border-color:var(--line); }
  .ctrl-btn svg{ width:18px; height:18px; fill:currentColor; }
  .ctrl-btn.play{
    width:38px; height:38px;
    background:linear-gradient(180deg,#00b6f5,#0096d3);
    color:#02202b;
  }
  .ctrl-btn.play:hover{ filter:brightness(1.08); background:linear-gradient(180deg,#00c2ff,#0098d4); }
  .ctrl-btn.play svg{ width:20px; height:20px; }

  .time-readout{
    flex:none;
    font-family:ui-monospace,Consolas,"Courier New",monospace;
    font-size:12px; color:var(--muted); white-space:nowrap;
  }
  .time-readout b{ color:var(--text); font-weight:600; }

  /* 进度条 / 滑块统一样式 */
  input[type="range"]{
    -webkit-appearance:none; appearance:none;
    height:6px;
    border-radius:999px;
    outline:none;
    cursor:pointer;
    background:linear-gradient(
      to right,
      var(--accent) 0%,
      var(--accent) var(--progress,0%),
      #2b323d var(--progress,0%),
      #2b323d 100%
    );
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:14px; height:14px; border-radius:50%;
    background:#fff; border:2px solid var(--accent);
    box-shadow:0 0 0 4px rgba(0,174,236,.18);
    transition:transform .12s ease;
  }
  input[type="range"]:hover::-webkit-slider-thumb{ transform:scale(1.1); }
  input[type="range"]::-moz-range-thumb{
    width:12px; height:12px; border-radius:50%;
    background:#fff; border:2px solid var(--accent);
  }
  input[type="range"]:disabled{ opacity:.4; cursor:not-allowed; }
  .seek{ flex:1; min-width:60px; }

  /* ---------- 右侧：备注面板 ---------- */
  .notes{ display:flex; flex-direction:column; overflow:hidden; }

  .notes-head{
    flex:none;
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 16px;
    border-bottom:1px solid var(--line);
    background:rgba(17,21,28,.7);
  }
  .notes-head h2{
    margin:0; font-size:14px; font-weight:600;
    display:flex; align-items:center; gap:8px;
  }
  .badge{
    font-size:11px; font-weight:600;
    padding:1px 8px; border-radius:999px;
    color:var(--accent); background:var(--accent-soft);
  }
  .sort-hint{ font-size:11px; color:var(--muted); }

  .composer{
    flex:none;
    display:flex; flex-direction:column; gap:10px;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
  }
  .composer textarea{
    width:100%; min-height:84px; max-height:190px;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:11px;
    background:#10141a;
    color:var(--text);
    font:inherit; font-size:13.5px; line-height:1.6;
    resize:vertical;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .composer textarea::placeholder{ color:#5b6473; }
  .composer textarea:focus{
    border-color:rgba(0,174,236,.7);
    box-shadow:0 0 0 3px rgba(0,174,236,.13);
  }

  .composer-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .stamp-wrap{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .stamp{
    display:flex; align-items:center; gap:6px;
    font-size:11.5px; color:var(--muted);
  }
  .stamp b{
    font-family:ui-monospace,Consolas,"Courier New",monospace;
    font-size:12px; font-weight:600; color:var(--accent);
    background:var(--accent-soft);
    padding:1px 7px; border-radius:7px;
  }
  .counter{ font-size:10.5px; color:#5b6473; }

  .save-btn{
    flex:none;
    padding:9px 18px;
    border:none; border-radius:10px;
    background:linear-gradient(180deg,#00b6f5,#0095d0);
    color:#02202b;
    font-size:13px; font-weight:600;
    cursor:pointer;
    transition:transform .15s ease, filter .15s ease;
    box-shadow:0 10px 24px -16px rgba(0,174,236,1);
  }
  .save-btn:hover{ transform:translateY(-1px); filter:brightness(1.07); }
  .save-btn:active{ transform:translateY(0); }

  .list-scroll{
    flex:1; min-height:0;
    overflow-y:auto;
    padding:12px;
    display:flex; flex-direction:column; gap:8px;
  }
  .list-scroll::-webkit-scrollbar{ width:8px; }
  .list-scroll::-webkit-scrollbar-track{ background:transparent; }
  .list-scroll::-webkit-scrollbar-thumb{ background:#2b323d; border-radius:99px; }
  .list-scroll::-webkit-scrollbar-thumb:hover{ background:#3a4350; }

  .note-list{
    margin:0; padding:0; list-style:none;
    display:flex; flex-direction:column; gap:8px;
  }
  .note{
    display:flex; align-items:flex-start; gap:10px;
    padding:10px 11px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#11161d;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .15s ease;
    animation:pop .18s ease;
  }
  .note:hover{
    border-color:rgba(0,174,236,.55);
    background:#141c25;
    transform:translateY(-1px);
  }
  .note.active{
    border-color:var(--accent);
    background:rgba(0,174,236,.12);
    box-shadow:inset 0 0 0 1px rgba(0,174,236,.25);
  }
  .note-time{
    flex:none;
    font-family:ui-monospace,Consolas,"Courier New",monospace;
    font-size:12px; font-weight:700; line-height:1.3;
    color:var(--accent);
    background:rgba(0,174,236,.12);
    padding:3px 8px;
    border-radius:8px;
  }
  .note-text{
    flex:1; min-width:0;
    font-size:13.5px; line-height:1.55;
    color:#dbe2ea;
    word-break:break-word;
    white-space:pre-wrap;
  }
  .note-del{
    flex:none;
    width:26px; height:26px;
    display:grid; place-items:center;
    border:1px solid transparent; border-radius:7px;
    background:transparent;
    color:#69737f;
    cursor:pointer;
    opacity:0;
    transition:.15s ease;
  }
  .note:hover .note-del,
  .note.active .note-del{ opacity:1; }
  .note-del:hover{ background:rgba(255,107,107,.14); color:var(--danger); }
  .note-del svg{ width:14px; height:14px; fill:currentColor; }

  .empty-list{
    margin:14px 2px;
    padding:26px 16px;
    display:none;
    flex-direction:column; gap:6px;
    text-align:center;
    border:1px dashed var(--line);
    border-radius:12px;
    color:var(--muted);
    font-size:12px; line-height:1.7;
  }
  .empty-list strong{ font-size:13px; font-weight:600; color:#aeb7c4; }

  .notes-foot{
    flex:none;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 16px;
    border-top:1px solid var(--line);
    font-size:11px; color:#6f7988;
    background:rgba(17,21,28,.6);
  }
  .link-btn{
    padding:4px 8px;
    border:none; border-radius:6px;
    background:transparent;
    color:#7d8798;
    font-size:11px;
    cursor:pointer;
    transition:.15s ease;
  }
  .link-btn:hover{ color:var(--danger); background:rgba(255,107,107,.1); }

  /* ==========================================================
     Toast 提示
     ========================================================== */
  .toast-wrap{
    position:fixed;
    left:50%; bottom:26px;
    transform:translateX(-50%);
    z-index:99;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    pointer-events:none;
  }
  .toast{
    padding:9px 16px;
    border:1px solid var(--line);
    border-radius:10px;
    background:rgba(28,34,43,.97);
    color:var(--text);
    font-size:12.5px;
    box-shadow:0 18px 34px -20px #000;
    animation:toastIn .2s ease;
  }
  .toast.ok{ border-color:rgba(61,220,151,.45); color:#9df3c7; }
  .toast.warn{ border-color:rgba(255,176,80,.45); color:#ffd08a; }

  @keyframes pop{
    from{ opacity:0; transform:translateY(4px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes toastIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* 拖拽文件时的提示边框 */
  .video-shell.dragover::after{
    content:"松开鼠标载入 MP4 录像";
    position:absolute; inset:10px;
    display:grid; place-items:center;
    border:2px dashed var(--accent);
    border-radius:12px;
    background:rgba(0,174,236,.08);
    color:#9fe4ff;
    font-size:13px;
    pointer-events:none;
  }

  .player:fullscreen{ border-radius:0; border:none; background:#000; }
  .player:fullscreen .video-shell{ flex:1; }

  /* ==========================================================
     窄屏：改为上下布局
     ========================================================== */
  @media (max-width:960px){
    body{ height:auto; min-height:100vh; overflow:auto; }
    .layout{
      grid-template-columns:1fr;
      padding:12px 12px 18px;
    }
    .topbar{ padding:12px 14px; }
    .hint{ display:none; }
    .video-shell video{ flex:none; height:auto; aspect-ratio:16/9; max-height:56vh; }
    .notes{ min-height:520px; }
    .note-del{ opacity:1; }
  }
</style>
</head>
<body>

  <!-- ================= 顶部栏 ================= -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">标</div>
      <div>
        <h1>交通录像标记</h1>
        <p>纯前端单文件 · 备注保存在本地浏览器</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="hint">支持 MP4 · 也可以把文件拖进播放器</span>
      <label class="file-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M13 3.5 6.8 11H11v7.5h4V11h4.2L13 3.5Z"/>
        </svg>
        选择 MP4 录像
        <input id="fileInput" type="file" accept="video/mp4" />
      </label>
    </div>
  </header>

  <!-- ================= 主体 ================= -->
  <main class="layout">

    <!-- ---------- 左：视频播放器 ---------- -->
    <section class="panel player" id="player">
      <div class="player-head">
        <span class="file-name" id="fileName">未选择文件</span>
        <span class="file-meta" id="videoMeta">—</span>
      </div>

      <div class="video-shell" id="videoShell">
        <video id="video" playsinline preload="metadata"></video>

        <div class="empty" id="emptyState">
          <div class="empty-inner">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6a1 1 0 0 0 1.52.85l10.5-6.8a1 1 0 0 0 0-1.7L9.52 4.35A1 1 0 0 0 8 5.2Z"/></svg>
            </div>
            <h3>还没有加载录像</h3>
            <p>点击右上角「选择 MP4 录像」，<br />或把 MP4 文件直接拖到这个区域。</p>
            <button class="ghost-btn" id="pickBtn" type="button">选择 MP4 文件</button>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl-btn play" id="playBtn" type="button" title="播放（空格）"></button>
        <span class="time-readout"><b id="curTime">00:00</b> / <span id="durTime">00:00</span></span>
        <input class="seek" id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="播放进度" />
        <button class="ctrl-btn" id="muteBtn" type="button" title="静音"></button>
        <button class="ctrl-btn" id="fsBtn" type="button" title="全屏"></button>
      </div>
    </section>

    <!-- ---------- 右：备注面板 ---------- -->
    <aside class="panel notes">
      <div class="notes-head">
        <h2>备注列表 <span class="badge" id="count">0</span></h2>
        <span class="sort-hint">按时间排序</span>
      </div>

      <div class="composer">
        <textarea id="noteInput" maxlength="200" placeholder="例如：留意右侧车道的白车……"></textarea>
        <div class="composer-row">
          <div class="stamp-wrap">
            <span class="stamp">记录时间点 <b id="stampTime">00:00</b></span>
            <span class="counter" id="charCount">0/200</span>
          </div>
          <button class="save-btn" id="saveBtn" type="button">保存备注</button>
        </div>
      </div>

      <div class="list-scroll">
        <ul class="note-list" id="noteList"></ul>
        <div class="empty-list" id="emptyList">
          <strong>还没有备注</strong>
          <span>把录像暂停在你关心的画面，输入备注后点击「保存备注」。</span>
        </div>
      </div>

      <div class="notes-foot">
        <span>数据保存在浏览器 localStorage</span>
        <button class="link-btn" id="clearBtn" type="button">清空全部</button>
      </div>
    </aside>

  </main>

  <div class="toast-wrap" id="toastWrap"></div>

<script>
(function () {
  'use strict';

  /* ============================================================
   * 0. DOM 引用
   * ============================================================ */
  const $ = (id) => document.getElementById(id);

  const video      = $('video');
  const fileInput  = $('fileInput');
  const pickBtn    = $('pickBtn');
  const emptyState = $('emptyState');
  const fileNameEl = $('fileName');
  const videoMeta  = $('videoMeta');
  const playBtn    = $('playBtn');
  const muteBtn    = $('muteBtn');
  const fsBtn      = $('fsBtn');
  const seek       = $('seek');
  const curTimeEl  = $('curTime');
  const durTimeEl  = $('durTime');
  const stampTime  = $('stampTime');
  const noteInput  = $('noteInput');
  const charCount  = $('charCount');
  const saveBtn    = $('saveBtn');
  const noteList   = $('noteList');
  const emptyList  = $('emptyList');
  const countEl    = $('count');
  const clearBtn   = $('clearBtn');
  const toastWrap  = $('toastWrap');
  const player     = $('player');
  const shell      = $('videoShell');

  /* 所有备注统一存在这一个 localStorage key 下（JSON 数组） */
  const STORAGE_KEY = 'traffic-video-notes-v1';
  const MAX_TEXT = 200;

  let notes = [];        // 备注数据：[{ id, time, text, createdAt }]
  let activeId = null;   // 当前高亮的备注 id
  let objectUrl = null;  // 当前 MP4 的 Blob URL
  let storageOK = true;  // localStorage 是否可用

  /* 内联 SVG 图标 */
  const ICON = {
    play: '<svg viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.52.85l10.5-6.8a1 1 0 0 0 0-1.7L9.52 4.35A1 1 0 0 0 8 5.2Z"/></svg>',
    pause: '<svg viewBox="0 0 24 24"><path d="M7 4.5h3.4v15H7zM13.6 4.5H17v15h-3.4z"/></svg>',
    volume: '<svg viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.2v13.6L7.2 14.5H4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1Zm12.3-2.2a1 1 0 0 1 1.4.1 6.7 6.7 0 0 1 0 9.2 1 1 0 1 1-1.5-1.3 4.7 4.7 0 0 0 0-6.6 1 1 0 0 1 .1-1.4Z"/></svg>',
    muted: '<svg viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.2v13.6L7.2 14.5H4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1Zm12.1-1.6a1 1 0 0 1 1.4 0l1.8 1.8 1.8-1.8a1 1 0 1 1 1.4 1.4L20.7 11l1.8 1.8a1 1 0 0 1-1.4 1.4l-1.8-1.8-1.8 1.8a1 1 0 0 1-1.4-1.4l1.8-1.8-1.8-1.8a1 1 0 0 1 0-1.4Z"/></svg>',
    fullscreen: '<svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4V4Zm10 0h6v6h-2V6h-4V4ZM4 14h2v4h4v2H4v-6Zm14 0h2v6h-6v-2h4v-4Z"/></svg>',
    trash: '<svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-3 6h12l-1 11a1 1 0 0 1-1 1h-8a1 1 0 0 1-1-1L6 9Zm3 2v8h2v-8H9Zm4 0v8h2v-8h-2Z"/></svg>'
  };

  /* ============================================================
   * 1. 时间格式化
   *    输入：秒（number）  输出：MM:SS
   *    说明：秒数向下取整；超过 1 小时时分钟位继续累加（如 75:03）
   * ============================================================ */
  function formatTime(seconds) {
    const total = Math.max(0, Math.floor(Number(seconds) || 0));
    const m = Math.floor(total / 60);
    const s = total % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  /* ============================================================
   * 2. localStorage 持久化
   *    存储结构：[{ id, time(秒, 保留0.1秒精度), text, createdAt }]
   *    整份数据一次性 JSON 序列化，保证连续添加不会互相覆盖
   * ============================================================ */
  function loadNotes() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      // 清洗数据，避免脏数据导致渲染报错
      return parsed
        .filter((n) => n && typeof n.text === 'string' && Number.isFinite(Number(n.time)))
        .map((n) => ({
          id: String(n.id || ('n_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6))),
          time: Math.max(0, Number(n.time)),
          text: String(n.text).slice(0, MAX_TEXT),
          createdAt: Number(n.createdAt) || Date.now()
        }))
        .sort((a, b) => a.time - b.time || a.createdAt - b.createdAt);
    } catch (err) {
      console.warn('[备注] 读取 localStorage 失败：', err);
      storageOK = false;
      return [];
    }
  }

  function persistNotes() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      storageOK = true;
    } catch (err) {
      storageOK = false;
      console.warn('[备注] 写入 localStorage 失败：', err);
      toast('浏览器拒绝了本地存储，备注仅保留在当前页面', 'warn');
    }
  }

  /* ============================================================
   * 3. 备注列表渲染
   *    使用 textContent 写入备注文本，防止 HTML 注入
   * ============================================================ */
  function renderNotes() {
    noteList.innerHTML = '';
    countEl.textContent = String(notes.length);
    emptyList.style.display = notes.length ? 'none' : 'flex';

    for (const note of notes) {
      const li = document.createElement('li');
      li.className = 'note' + (note.id === activeId ? ' active' : '');
      li.dataset.id = note.id;
      li.title = '点击跳转到 ' + formatTime(note.time) + ' 并暂停';

      const timeEl = document.createElement('span');
      timeEl.className = 'note-time';
      timeEl.textContent = formatTime(note.time);

      const textEl = document.createElement('span');
      textEl.className = 'note-text';
      textEl.textContent = note.text;

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'note-del';
      delBtn.title = '删除这条备注';
      delBtn.innerHTML = ICON.trash;

      li.append(timeEl, textEl, delBtn);
      noteList.appendChild(li);
    }
  }

  function setActive(id) {
    activeId = id;
    const items = noteList.children;
    for (let i = 0; i < items.length; i++) {
      items[i].classList.toggle('active', items[i].dataset.id === id);
    }
  }

  /* ============================================================
   * 4. 新增备注
   *    自动读取 video.currentTime，与文本一起存入数组并持久化
   * ============================================================ */
  function addNote() {
    if (!video.src) {
      toast('请先选择一个 MP4 录像文件', 'warn');
      return;
    }
    const text = noteInput.value.trim();
    if (!text) {
      toast('备注内容不能为空', 'warn');
      noteInput.focus();
      return;
    }

    const now = Number.isFinite(video.currentTime) ? video.currentTime : 0;
    const duration = Number.isFinite(video.duration) ? video.duration : now;
    // 记录精确到 0.1 秒，列表中显示为 MM:SS
    const time = Math.round(Math.min(now, duration) * 10) / 10;

    const note = {
      id: 'n_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7),
      time: Math.max(0, time),
      text: text.slice(0, MAX_TEXT),
      createdAt: Date.now()
    };

    notes.push(note);
    notes.sort((a, b) => a.time - b.time || a.createdAt - b.createdAt);

    persistNotes();       // 关键：立即写回 localStorage，连续添加不会丢失旧记录
    renderNotes();
    setActive(note.id);

    noteInput.value = '';
    charCount.textContent = '0/' + MAX_TEXT;

    toast('已保存备注 ' + formatTime(note.time), 'ok');

    // 让新记录滚动到可见区域
    const el = noteList.querySelector('[data-id="' + note.id + '"]');
    if (el && typeof el.scrollIntoView === 'function') {
      el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  /* ============================================================
   * 5. 点击回看：跳转到记录时间点并暂停
   * ============================================================ */
  function seekToNote(id) {
    const note = notes.find((n) => n.id === id);
    if (!note) return;

    if (!video.src) {
      toast('请先加载录像文件，再点击备注回看', 'warn');
      return;
    }

    // 关键逻辑：先暂停，再把 currentTime 设为记录时间，画面会立即跳到该帧
    video.pause();
    const limit = Number.isFinite(video.duration) ? Math.max(0, video.duration - 0.05) : note.time;
    try {
      video.currentTime = Math.min(note.time, limit);
    } catch (err) {
      console.warn('[备注] 跳转失败：', err);
    }

    setActive(id);
    updateTimeUI();
  }

  function deleteNote(id) {
    notes = notes.filter((n) => n.id !== id);
    if (activeId === id) activeId = null;
    persistNotes();
    renderNotes();
    toast('已删除该备注');
  }

  /* ============================================================
   * 6. 播放器控制
   * ============================================================ */
  function updatePlayIcon() {
    const playing = !!video.src && !video.paused && !video.ended;
    playBtn.innerHTML = playing ? ICON.pause : ICON.play;
    playBtn.title = playing ? '暂停（空格）' : '播放（空格）';
  }

  function updateMuteIcon() {
    muteBtn.innerHTML = (video.muted || video.volume === 0) ? ICON.muted : ICON.volume;
    muteBtn.title = (video.muted || video.volume === 0) ? '取消静音' : '静音';
  }

  function syncProgress() {
    const dur = (Number.isFinite(video.duration) && video.duration > 0) ? video.duration : 0;
    const pct = dur ? Math.min(100, Math.max(0, (video.currentTime / dur) * 100)) : 0;
    seek.style.setProperty('--progress', pct.toFixed(2) + '%');
    seek.disabled = !dur;
  }

  function updateTimeUI() {
    const cur = Number.isFinite(video.currentTime) ? video.currentTime : 0;
    const dur = (Number.isFinite(video.duration) && video.duration > 0) ? video.duration : 0;

    curTimeEl.textContent = formatTime(cur);
    durTimeEl.textContent = formatTime(dur);
    stampTime.textContent = formatTime(cur);   // 输入框旁实时显示当前时间

    seek.max = String(dur || 0);
    if (!seeking) seek.value = String(Math.min(cur, dur || cur));
    syncProgress();
  }

  function togglePlay() {
    if (!video.src) {
      toast('请先选择一个 MP4 录像文件', 'warn');
      return;
    }
    if (video.paused) {
      const p = video.play();
      if (p && typeof p.catch === 'function') {
        p.catch(() => toast('播放失败，可能是该编码不被浏览器支持', 'warn'));
      }
    } else {
      video.pause();
    }
  }

  function step(seconds) {
    if (!video.src || !Number.isFinite(video.duration)) return;
    video.currentTime = Math.min(Math.max(0, video.currentTime + seconds), video.duration);
    updateTimeUI();
  }

  /* ============================================================
   * 7. 加载本地 MP4
   * ============================================================ */
  function loadFile(file) {
    if (!file) return;
    const isMp4 = /\.mp4$/i.test(file.name) || file.type === 'video/mp4' || file.type === 'video/quicktime';
    if (!isMp4) {
      toast('请选择 MP4 格式的录像文件', 'warn');
      return;
    }

    // 释放上一个 Blob URL，避免内存泄漏
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(file);

    video.src = objectUrl;
    video.load();

    emptyState.classList.add('hidden');
    fileNameEl.textContent = file.name;
    videoMeta.textContent = '加载中…';
    activeId = null;
    renderNotes();
    document.title = file.name + ' · 交通录像标记';
  }

  /* ============================================================
   * 8. Toast 提示
   * ============================================================ */
  function toast(message, kind) {
    const el = document.createElement('div');
    el.className = 'toast' + (kind ? ' ' + kind : '');
    el.textContent = message;
    toastWrap.appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity .25s ease, transform .25s ease';
      el.style.opacity = '0';
      el.style.transform = 'translateY(6px)';
      setTimeout(() => el.remove(), 280);
    }, 2200);
  }

  /* ============================================================
   * 9. 事件绑定
   * ============================================================ */
  let seeking = false;

  // —— 选择文件 ——
  fileInput.addEventListener('change', function (e) {
    const file = e.target.files && e.target.files[0];
    if (file) loadFile(file);
    e.target.value = ''; // 允许重复选择同一个文件
  });
  pickBtn.addEventListener('click', () => fileInput.click());

  // —— 视频事件 ——
  video.addEventListener('loadedmetadata', () => {
    const dur = Number.isFinite(video.duration) ? video.duration : 0;
    durTimeEl.textContent = formatTime(dur);
    videoMeta.textContent = [formatTime(dur), video.videoWidth ? video.videoWidth + '×' + video.videoHeight : '']
      .filter(Boolean).join(' · ');
    updateTimeUI();
  });
  video.addEventListener('timeupdate', updateTimeUI);
  video.addEventListener('durationchange', updateTimeUI);
  video.addEventListener('play', updatePlayIcon);
  video.addEventListener('pause', () => { updatePlayIcon(); updateTimeUI(); });
  video.addEventListener('ended', updatePlayIcon);
  video.addEventListener('error', () => {
    toast('该 MP4 无法播放（可能是 H.265/HEVC 等不受支持的编码）', 'warn');
    emptyState.classList.remove('hidden');
    videoMeta.textContent = '加载失败';
  });
  video.addEventListener('click', togglePlay);

  // —— 控制条 ——
  playBtn.addEventListener('click', togglePlay);
  muteBtn.addEventListener('click', () => {
    video.muted = !video.muted;
    updateMuteIcon();
  });
  fsBtn.addEventListener('click', () => {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else if (player.requestFullscreen) {
      player.requestFullscreen().catch(() => toast('当前浏览器不支持全屏', 'warn'));
    }
  });

  seek.addEventListener('pointerdown', () => { seeking = true; });
  window.addEventListener('pointerup', () => { seeking = false; });
  seek.addEventListener('input', () => {
    if (!video.src) return;
    const t = Number(seek.value);
    if (Number.isFinite(t)) video.currentTime = t;
    syncProgress();
    updateTimeUI();
  });

  // —— 备注操作 ——
  saveBtn.addEventListener('click', addNote);

  noteInput.addEventListener('input', () => {
    charCount.textContent = noteInput.value.length + '/' + MAX_TEXT;
  });
  noteInput.addEventListener('keydown', (e) => {
    // Ctrl/Cmd + Enter 快捷保存
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      addNote();
    }
  });

  // 列表用事件委托：点击整行回看，点击垃圾桶删除
  noteList.addEventListener('click', (e) => {
    const li = e.target.closest('.note');
    if (!li) return;
    const id = li.dataset.id;
    if (e.target.closest('.note-del')) {
      deleteNote(id);
      return;
    }
    seekToNote(id);
  });

  clearBtn.addEventListener('click', () => {
    if (!notes.length) {
      toast('列表已经是空的');
      return;
    }
    if (window.confirm('确定要清空全部 ' + notes.length + ' 条备注吗？此操作不可撤销。')) {
      notes = [];
      activeId = null;
      persistNotes();
      renderNotes();
      toast('已清空全部备注');
    }
  });

  // —— 拖拽 MP4 到播放器 ——
  ['dragenter', 'dragover'].forEach((type) => {
    shell.addEventListener(type, (e) => {
      e.preventDefault();
      e.stopPropagation();
      shell.classList.add('dragover');
    });
  });
  ['dragleave', 'dragend'].forEach((type) => {
    shell.addEventListener(type, (e) => {
      e.preventDefault();
      if (type === 'dragleave' && shell.contains(e.relatedTarget)) return;
      shell.classList.remove('dragover');
    });
  });
  shell.addEventListener('drop', (e) => {
    e.preventDefault();
    e.stopPropagation();
    shell.classList.remove('dragover');
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) loadFile(file);
  });

  // —— 快捷键：空格播放/暂停，左右方向键 ±5 秒 ——
  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || tag === 'select' ||
                   tag === 'button' || e.target.isContentEditable;
    if (typing) return;

    if (e.code === 'Space') {
      e.preventDefault();
      togglePlay();
    } else if (e.code === 'ArrowLeft') {
      e.preventDefault();
      step(-5);
    } else if (e.code === 'ArrowRight') {
      e.preventDefault();
      step(5);
    }
  });

  /* ============================================================
   * 10. 初始化
   * ============================================================ */
  playBtn.innerHTML = ICON.play;
  muteBtn.innerHTML = ICON.volume;
  fsBtn.innerHTML = ICON.fullscreen;

  notes = loadNotes();      // 刷新页面后从 localStorage 恢复记录
  renderNotes();
  updateTimeUI();
  updatePlayIcon();
  updateMuteIcon();

  if (!storageOK) {
    toast('注意：当前浏览器禁止本地存储，备注刷新后会丢失', 'warn');
  }
})();
</script>
</body>
</html>
