<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交通录像标记小工具 · 京津车流</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: #1e1f22; color: #eaeef2; margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .container {
            max-width: 1200px; width: 100%; background: #2a2c30; border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); padding: 24px;
            display: flex; flex-wrap: wrap; gap: 24px;
        }
        .video-section { flex: 2; min-width: 500px; display: flex; flex-direction: column; gap: 16px; }
        .video-wrapper {
            background: #0b0c0e; border-radius: 16px; overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); aspect-ratio: 16 / 9;
            display: flex; align-items: center; justify-content: center;
        }
        video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
        .controls {
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            background: #222428; padding: 12px 20px; border-radius: 60px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .controls button {
            background: #3b3f46; border: 1px solid #4e525b; color: white;
            font-size: 1rem; padding: 10px 18px; border-radius: 40px;
            cursor: pointer; font-weight: 500; transition: background 0.2s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .controls button:hover { background: #4e545e; }
        .controls button:active { background: #2f3339; }
        .controls button.danger { border-color: #b3261e; color: #ffb4ab; }
        .controls button.danger:hover { background: #b3261e; color: white; }
        .time-display {
            font-variant-numeric: tabular-nums; font-size: 1rem; background: #121316;
            padding: 8px 14px; border-radius: 40px; letter-spacing: 0.5px;
            border: 1px solid #3a3e46; color: #b9c2d0; margin-left: auto;
        }
        .note-section {
            flex: 1.2; min-width: 320px; background: #222428; border-radius: 20px;
            padding: 20px; display: flex; flex-direction: column; gap: 18px;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.05), 0 8px 18px rgba(0,0,0,0.4);
        }
        .note-section h2 {
            margin: 0; font-size: 1.6rem; font-weight: 500; color: #cfd9e6;
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        }
        .note-section h2 span.badge {
            background: #3d6eff; border-radius: 40px; font-size: 1rem;
            padding: 2px 12px; color: white;
        }
        .h2-btn-group { margin-left: auto; display: flex; gap: 6px; }
        .input-area { display: flex; flex-direction: column; gap: 10px; }
        .input-area label { font-size: 0.9rem; color: #9aa5b5; font-weight: 500; }
        .input-area input {
            background: #15171b; border: 1px solid #3a3f49; color: #eef3fc;
            padding: 14px 16px; border-radius: 14px; font-size: 1rem;
            outline: none; transition: border 0.2s;
        }
        .input-area input:focus { border-color: #3d6eff; box-shadow: 0 0 0 2px rgba(61,110,255,0.3); }
        .input-area input::placeholder { color: #6b7482; }
        .save-btn {
            background: #3d6eff; border: 1px solid #5b84ff; color: white;
            font-weight: 600; padding: 14px 20px; border-radius: 40px; font-size: 1rem;
            cursor: pointer; transition: background 0.2s; display: flex;
            align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 6px 14px rgba(61,110,255,0.4);
        }
        .save-btn:hover { background: #2b5be0; }
        .save-btn:active { background: #1f46b8; }
        .notes-list {
            flex: 1; overflow-y: auto; max-height: 380px; display: flex;
            flex-direction: column; gap: 10px; padding-right: 6px;
        }
        .notes-list::-webkit-scrollbar { width: 6px; }
        .notes-list::-webkit-scrollbar-track { background: #1b1d21; border-radius: 10px; }
        .notes-list::-webkit-scrollbar-thumb { background: #3b3f46; border-radius: 10px; }
        .note-item {
            background: #1b1d21; border-left: 5px solid #3d6eff; padding: 12px 16px;
            border-radius: 12px; cursor: pointer; transition: background 0.15s, transform 0.1s;
            display: flex; align-items: center; gap: 12px; border: 1px solid #32363e;
        }
        .note-item:hover { background: #2b3038; border-left-color: #6b92ff; }
        .note-item:active { background: #1f2329; }
        .note-item .note-body { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .note-time {
            font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.85rem;
            color: #9bb0d0; display: flex; align-items: center; gap: 6px;
        }
        .note-text { font-size: 1rem; color: #f0f4fe; word-break: break-word; line-height: 1.4; }
        .delete-btn {
            flex-shrink: 0; background: transparent; border: 1px solid #4e525b;
            color: #9aa5b5; width: 30px; height: 30px; border-radius: 50%;
            cursor: pointer; font-size: 0.85rem; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .delete-btn:hover { background: #b3261e; color: white; border-color: #b3261e; }
        .empty-state {
            color: #6b7482; font-style: italic; padding: 30px 10px; text-align: center;
            background: #191b1f; border-radius: 14px; border: 1px dashed #3a3f49;
        }
        .file-hint { font-size: 0.8rem; color: #7b8595; text-align: right; }
        .mini-btn {
            background: #2e3239; border: 1px solid #4e525b; color: #cfd9e6;
            font-size: 0.8rem; padding: 5px 10px; border-radius: 30px;
            cursor: pointer; transition: background 0.15s;
        }
        .mini-btn:hover { background: #3d434c; }
        .mini-btn:active { background: #22262c; }
        .status-msg { font-size: 0.8rem; color: #7b8595; min-height: 18px; }
    </style>
</head>
<body>
<div class="container">
    <div class="video-section">
        <div class="video-wrapper">
            <video id="videoPlayer" src="" preload="metadata" controls></video>
        </div>
        <div class="controls">
            <button id="playPauseBtn">▶ 播放</button>
            <button id="loadVideoBtn">📂 载入录像</button>
            <button id="deleteVideoBtn" class="danger" title="移除当前视频（备注会保留）">🗑️ 删除视频</button>
            <button id="addNoteQuickBtn" title="快速聚焦备注输入框">📝 备注</button>
            <div class="time-display" id="currentTimeDisplay">00:00 / 00:00</div>
        </div>
        <div class="file-hint">
            ⚡ 视频与备注都会自动保存在本浏览器；刷新后自动恢复
            <span id="videoStatus" class="status-msg"></span>
        </div>
    </div>

    <div class="note-section">
        <h2>
            📌 标记列表 <span class="badge" id="noteCount">0</span>
            <span class="h2-btn-group">
                <button id="exportBtn" class="mini-btn" title="导出标记为JSON文件">⬇️ 导出</button>
                <button id="importBtn" class="mini-btn" title="从JSON文件导入标记">⬆️ 导入</button>
                <button id="clearAllBtn" class="mini-btn" title="清空全部标记（不可恢复）">🗑️ 清空</button>
            </span>
        </h2>
        <div class="input-area">
            <label for="noteInput">给当前画面写备注（自动记录当前时间）</label>
            <input type="text" id="noteInput" placeholder="例如：留意右侧车道的白车" maxlength="120" autocomplete="off">
            <button class="save-btn" id="saveNoteBtn">💾 保存备注</button>
        </div>
        <div class="notes-list" id="notesList">
            <div class="empty-state">还没有标记，暂停视频并添加第一条备注吧</div>
        </div>
    </div>
</div>

<input type="file" id="fileInput" accept="video/mp4,video/quicktime,video/webm,video/ogg" style="display:none">

<script>
(function() {
    // ---------- DOM ----------
    const video          = document.getElementById('videoPlayer');
    const playPauseBtn   = document.getElementById('playPauseBtn');
    const loadVideoBtn   = document.getElementById('loadVideoBtn');
    const deleteVideoBtn = document.getElementById('deleteVideoBtn');
    const quickNoteBtn   = document.getElementById('addNoteQuickBtn');
    const timeDisplay    = document.getElementById('currentTimeDisplay');
    const noteInput      = document.getElementById('noteInput');
    const saveBtn        = document.getElementById('saveNoteBtn');
    const notesContainer = document.getElementById('notesList');
    const noteCountSpan  = document.getElementById('noteCount');
    const fileInput      = document.getElementById('fileInput');
    const exportBtn      = document.getElementById('exportBtn');
    const importBtn      = document.getElementById('importBtn');
    const clearAllBtn    = document.getElementById('clearAllBtn');
    const videoStatus    = document.getElementById('videoStatus');

    // ---------- localStorage（备注） ----------
    const STORAGE_KEY = 'traffic_video_notes_v1';
    let notes = [];

    function loadNotesFromStorage() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed)) {
                    notes = parsed.filter(n => n && typeof n.time === 'number' && typeof n.text === 'string');
                }
            }
        } catch (e) {
            console.warn('读取本地备注失败', e);
            notes = [];
        }
    }

    function saveNotesToStorage() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
        } catch (e) {
            console.warn('保存本地备注失败', e);
        }
    }

    // ---------- IndexedDB（视频文件） ----------
    const DB_NAME = 'traffic_video_db';
    const DB_VERSION = 1;
    const STORE_NAME = 'videos';
    const VIDEO_KEY = 'current_video';
    let db = null;

    function openDB() {
        return new Promise((resolve, reject) => {
            if (db) { resolve(db); return; }
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onerror = () => reject(req.error);
            req.onsuccess = () => { db = req.result; resolve(db); };
            req.onupgradeneeded = (e) => {
                const database = e.target.result;
                if (!database.objectStoreNames.contains(STORE_NAME)) {
                    database.createObjectStore(STORE_NAME);
                }
            };
        });
    }

    async function saveVideoToDB(file) {
        try {
            const database = await openDB();
            return new Promise((resolve, reject) => {
                const tx = database.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.put({
                    blob: file,
                    name: file.name,
                    type: file.type,
                    lastModified: file.lastModified || Date.now()
                }, VIDEO_KEY);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
                tx.onabort = () => reject(tx.error);
            });
        } catch (e) {
            console.warn('保存视频到 IndexedDB 失败', e);
            throw e;
        }
    }

    async function loadVideoFromDB() {
        try {
            const database = await openDB();
            return new Promise((resolve, reject) => {
                const tx = database.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.get(VIDEO_KEY);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => reject(req.error);
            });
        } catch (e) {
            console.warn('读取 IndexedDB 视频失败', e);
            return null;
        }
    }

    async function clearVideoFromDB() {
        try {
            const database = await openDB();
            return new Promise((resolve, reject) => {
                const tx = database.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.delete(VIDEO_KEY);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        } catch (e) {
            console.warn('清除视频失败', e);
        }
    }

    function restoreVideoRecord(record) {
        if (!record || !record.blob) return false;
        try {
            const url = URL.createObjectURL(record.blob);
            video.src = url;
            video.load();
            videoStatus.textContent = `已恢复：${record.name || '上次的视频'}`;
            return true;
        } catch (e) {
            console.warn('恢复视频失败', e);
            return false;
        }
    }

    // ---------- 工具 ----------
    function formatTime(sec) {
        if (isNaN(sec) || !isFinite(sec)) return '00:00';
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = Math.floor(sec % 60);
        return h > 0
            ? `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
            : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function updateTimeDisplay() {
        const cur = video.currentTime || 0;
        const dur = video.duration || 0;
        timeDisplay.textContent = `${formatTime(cur)} / ${formatTime(dur)}`;
    }

    function updatePlayPause() {
        playPauseBtn.innerHTML = video.paused ? '▶ 播放' : '⏸️ 暂停';
    }

    // ---------- 渲染 ----------
    function renderNotes() {
        if (notes.length === 0) {
            notesContainer.innerHTML = '<div class="empty-state">还没有标记，暂停视频并添加第一条备注吧</div>';
            noteCountSpan.textContent = '0';
            return;
        }

        const sorted = [...notes].sort((a, b) => a.time - b.time);
        notesContainer.innerHTML = '';

        sorted.forEach(note => {
            const item = document.createElement('div');
            item.className = 'note-item';
            item.dataset.id = note.id;
            item.dataset.time = note.time;

            const body = document.createElement('div');
            body.className = 'note-body';

            const timeDiv = document.createElement('div');
            timeDiv.className = 'note-time';
            timeDiv.innerHTML = `⏱️ ${formatTime(note.time)}`;

            const textDiv = document.createElement('div');
            textDiv.className = 'note-text';
            textDiv.textContent = note.text;

            body.appendChild(timeDiv);
            body.appendChild(textDiv);

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.title = '删除这条备注';
            delBtn.textContent = '✕';
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (confirm('删除这条备注？')) {
                    notes = notes.filter(n => n.id !== note.id);
                    saveNotesToStorage();
                    renderNotes();
                }
            });

            item.appendChild(body);
            item.appendChild(delBtn);

            item.addEventListener('click', () => {
                if (!video.src) { alert('请先载入录像'); return; }
                if (isNaN(video.duration)) return;
                const target = parseFloat(item.dataset.time);
                if (!isNaN(target)) {
                    video.currentTime = Math.min(target, video.duration - 0.05);
                    updateTimeDisplay();
                    item.style.background = '#3d6eff44';
                    setTimeout(() => { item.style.background = ''; }, 200);
                }
            });

            notesContainer.appendChild(item);
        });

        noteCountSpan.textContent = notes.length;
    }

    // ---------- 添加 ----------
    function addNote() {
        if (!video.src) {
            alert('请先点击「📂 载入录像」选择视频文件');
            return;
        }
        if (isNaN(video.duration) || video.duration === 0) {
            alert('视频尚未加载完成，请稍候');
            return;
        }
        const text = noteInput.value.trim();
        if (!text) {
            alert('请输入备注内容');
            noteInput.focus();
            return;
        }
        const time = video.currentTime;
        if (isNaN(time) || time < 0) {
            alert('视频时间无效');
            return;
        }
        const safeTime = Math.min(time, video.duration);

        notes.push({
            id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
            time: safeTime,
            text: text
        });

        saveNotesToStorage();
        noteInput.value = '';
        renderNotes();
        noteInput.focus();
    }

    // ---------- 导出 / 导入 / 清空 ----------
    function exportNotes() {
        if (notes.length === 0) {
            alert('当前没有标记可导出');
            return;
        }
        const dataStr = JSON.stringify(notes, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `traffic_notes_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function importNotes() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'application/json,.json';
        input.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const parsed = JSON.parse(ev.target.result);
                    if (!Array.isArray(parsed)) {
                        alert('文件格式不正确：应为备注数组');
                        return;
                    }
                    const valid = parsed.filter(n => n && typeof n.time === 'number' && typeof n.text === 'string');
                    if (valid.length === 0) {
                        alert('文件中没有有效的备注记录');
                        return;
                    }
                    if (notes.length > 0) {
                        if (!confirm(`当前已有 ${notes.length} 条备注，导入后将合并。继续？`)) return;
                    }
                    const existingIds = new Set(notes.map(n => n.id));
                    let added = 0;
                    valid.forEach(n => {
                        const id = n.id || (Date.now() + '-' + Math.random().toString(36).slice(2,8));
                        if (!existingIds.has(id)) {
                            notes.push({ ...n, id });
                            existingIds.add(id);
                            added++;
                        }
                    });
                    saveNotesToStorage();
                    renderNotes();
                    alert(`导入完成，新增 ${added} 条备注。`);
                } catch (err) {
                    alert('导入失败：文件不是合法的 JSON');
                    console.error(err);
                }
            };
            reader.readAsText(file);
        };
        input.click();
    }

    function clearAllNotes() {
        if (notes.length === 0) {
            alert('当前没有标记可清空');
            return;
        }
        if (confirm(`确定清空全部 ${notes.length} 条标记吗？此操作不可恢复（建议先导出备份）。`)) {
            notes = [];
            saveNotesToStorage();
            renderNotes();
        }
    }

    // ---------- 删除视频（保留备注） ----------
    async function deleteVideo() {
        if (!video.src) {
            alert('当前没有载入视频');
            return;
        }
        if (!confirm('确定移除当前视频吗？\n（备注标记会保留，IndexedDB 中的视频副本也会删除，刷新后不会再自动恢复）')) {
            return;
        }
        // 清空 <video>
        video.pause();
        video.removeAttribute('src');
        video.load();
        // 释放旧 blob URL（如果有）
        try {
            if (video.src && video.src.startsWith('blob:')) {
                URL.revokeObjectURL(video.src);
            }
        } catch (e) {}
        // 清 IndexedDB
        await clearVideoFromDB();
        videoStatus.textContent = '视频已删除，备注已保留';
        updateTimeDisplay();
        updatePlayPause();
    }

    // ---------- 事件绑定 ----------
    playPauseBtn.addEventListener('click', () => {
        if (!video.src) { alert('请先载入录像'); return; }
        if (video.paused) video.play().catch(e => console.warn(e));
        else video.pause();
    });

    loadVideoBtn.addEventListener('click', () => fileInput.click());
    deleteVideoBtn.addEventListener('click', deleteVideo);

    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        video.src = url;
        video.load();
        video.pause();
        updatePlayPause();
        updateTimeDisplay();
        fileInput.value = '';

        videoStatus.textContent = '正在保存视频到本地…';
        try {
            await saveVideoToDB(file);
            videoStatus.textContent = `已保存：${file.name}`;
        } catch (err) {
            videoStatus.textContent = '视频保存失败（可能空间不足），刷新后需重新选择';
        }
    });

    quickNoteBtn.addEventListener('click', () => {
        noteInput.focus();
        noteInput.style.background = '#2a3a5a';
        setTimeout(() => { noteInput.style.background = ''; }, 200);
    });

    saveBtn.addEventListener('click', addNote);
    noteInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); addNote(); }
    });

    video.addEventListener('timeupdate', updateTimeDisplay);
    video.addEventListener('durationchange', updateTimeDisplay);
    video.addEventListener('play', updatePlayPause);
    video.addEventListener('pause', updatePlayPause);
    video.addEventListener('loadedmetadata', () => {
        updateTimeDisplay();
        updatePlayPause();
    });

    exportBtn.addEventListener('click', exportNotes);
    importBtn.addEventListener('click', importNotes);
    clearAllBtn.addEventListener('click', clearAllNotes);

    // ---------- 初始化 ----------
    (async function init() {
        loadNotesFromStorage();
        renderNotes();
        updateTimeDisplay();
        updatePlayPause();

        try {
            const record = await loadVideoFromDB();
            if (record && record.blob) {
                restoreVideoRecord(record);
                video.addEventListener('loadedmetadata', function onMeta() {
                    updateTimeDisplay();
                    video.removeEventListener('loadedmetadata', onMeta);
                });
            } else {
                videoStatus.textContent = '首次使用，请点击「📂 载入录像」';
            }
        } catch (e) {
            console.warn(e);
            videoStatus.textContent = '无法恢复上次视频，请重新载入';
        }
    })();
})();
</script>
</body>
</html>
